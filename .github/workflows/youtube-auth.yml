name: YouTube - Re-authorise (Manual)

run-name: "youtube_auth: refresh the channel token"

# The channel's OAuth app is in Testing, which caps a refresh token's life at
# seven days. Rather than needing a laptop and a terminal every week, this
# runs Google's device flow: it publishes a short code to the output branch
# for the dashboard to show, waits for the approval, and writes the new token
# straight into Actions secrets. The token never reaches the branch or the
# browser -- only the user code does, and that is worthless to anyone who
# cannot also sign into the channel's Google account.
#
# It is one Python step on purpose. The first version committed the code with
# git, which meant switching the checkout to the output branch mid-run -- and
# that replaced the very package the next step imported. It also spent three
# minutes fetching a 2.5GB branch to write 200 bytes, while the code it was
# publishing was already ticking down. The contents API does it in one call
# and leaves the checkout alone.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: youtube-auth
  cancel-in-progress: true

jobs:
  authorise:
    runs-on: ubuntu-latest
    # Google gives the code 30 minutes; this stops a forgotten run from
    # holding a runner for the default six hours.
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyNaCl
        run: pip install --quiet pynacl

      - name: Authorise and store the token
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          # Writes the user code to the output branch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Writes the refreshed token into Actions secrets, which the
          # built-in token is not allowed to do.
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          mkdir -p out
          python -m youtube_tools.device_auth \
            --code-file out/auth-code.json \
            --publish-branch cars-output \
            --publish-path youtube/auth-code.json
