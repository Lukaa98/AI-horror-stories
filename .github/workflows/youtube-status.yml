name: YouTube - Refresh channel snapshot (Manual)

run-name: "youtube_status: refresh"

# Asks YouTube what the channel looks like and leaves the answer on the
# output branch for the dashboard to read. The dashboard cannot ask
# directly: the refresh token is a repository secret and never reaches the
# browser, by design.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: youtube-status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the Google client libraries
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib

      - name: Read the channel
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m youtube_tools.channel_status
