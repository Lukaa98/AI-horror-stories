name: shorts_transcripts

# Read a few Shorts' spoken tracks so a script's shape can be compared to
# ours. It runs here rather than in a session or the dashboard: the session's
# egress proxy refuses to tunnel to youtube.com at all, and a page served from
# github.io cannot fetch it because YouTube sends no CORS header. A runner has
# neither problem.
#
# Reference material for working out what to write, kept on the output branch
# next to everything else. Not published anywhere.

on:
  workflow_dispatch:
    inputs:
      videos:
        description: >-
          Shorts URLs, video ids, or pasted channel-page source -- anything with
          ids in it. Separated by spaces or newlines.
        required: true
        type: string
      label:
        description: "Folder name for this batch, e.g. driving-lab"
        required: true
        type: string
      limit:
        description: "Most videos to read (default 20)"
        required: false
        default: "20"
        type: string

# Three clicks in thirty seconds produced three runs, two of which could
# not push: they raced each other on the same branch and the rejection was
# swallowed by the retry loop. One at a time instead.
concurrency:
  group: shorts-transcripts
  cancel-in-progress: false

permissions:
  contents: write

env:
  OUTPUT_BRANCH: cars-output

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Read the transcripts
        run: |
          printf '%s' "${{ inputs.videos }}" > /tmp/videos.txt
          python youtube_tools/shorts_transcript.py \
            --from-text /tmp/videos.txt \
            --limit "${{ inputs.limit }}" \
            --out "/tmp/transcripts.json"

      - name: Commit to the output branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin "$OUTPUT_BRANCH"
          git checkout -B "$OUTPUT_BRANCH" "origin/$OUTPUT_BRANCH"
          DEST="research/shorts-transcripts/${{ inputs.label }}"
          mkdir -p "$DEST"
          cp /tmp/transcripts.json "$DEST/transcripts.json"
          git add "$DEST"
          # "|| exit 0" here meant a run that changed nothing reported green.
          git commit -m "Read ${{ inputs.label }} Shorts transcripts"
          for attempt in 1 2 3 4; do
            git push origin "$OUTPUT_BRANCH" && exit 0
            # Somebody else moved the branch: take their commit and retry.
            git fetch origin "$OUTPUT_BRANCH" && git rebase "origin/$OUTPUT_BRANCH" || true
            sleep $((2 ** attempt))
          done
          echo "Could not push to $OUTPUT_BRANCH after four attempts." >&2
          exit 1
